<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Visiting Cards - Meezan Printing Press</title>

<style>
body {
    font-family: Arial, sans-serif;
    margin: 0;
    background: #f5f5f5;
}

header {
    background: #111;
    color: white;
    text-align: center;
    padding: 30px 15px;
}

header h1 {
    margin: 0 0 10px;
}

.container {
    max-width: 1100px;
    margin: 35px auto;
    padding: 0 20px;
}

.back {
    display: inline-block;
    margin-bottom: 25px;
    text-decoration: none;
    color: #111;
    font-weight: bold;
}

h2 {
    text-align: center;
    margin-bottom: 30px;
}

.cards {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 25px;
}

.card {
    background: white;
    border-radius: 12px;
    padding: 25px;
    text-align: center;
    box-shadow: 0 4px 15px rgba(0,0,0,0.12);
}

.design {
    height: 160px;
    background: #e8e8e8;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 50px;
    margin-bottom: 15px;
}

.card h3 {
    margin: 10px 0;
}

.price {
    font-size: 20px;
    font-weight: bold;
    margin: 12px 0;
}

button {
    background: #111;
    color: white;
    border: none;
    padding: 10px 22px;
    border-radius: 6px;
}

@media (max-width: 700px) {
    .cards {
        grid-template-columns: 1fr;
    }
}
</style>
</head>

<body>

<header>
    <h1>Visiting Cards</h1>
    <p>Meezan Printing Press — Bannu</p>
</header>

<div class="container">

    <a href="index.html" class="back">← Back to Home</a>

    <h2>Our Visiting Card Qualities</h2>

    <div class="cards">

        <div class="card">
            <div class="design">💳</div>
            <h3>Quality 1</h3>
            <p>Standard Quality</p>
            <div class="price">Rs. 0</div>
            <button>Order Now</button>
        </div>

        <div class="card">
            <div class="design">💳</div>
            <h3>Quality 2</h3>
            <p>Good Quality</p>
            <div class="price">Rs. 0</div>
            <button>Order Now</button>
        </div>

        <div class="card">
            <div class="design">💳</div>
            <h3>Quality 3</h3>
            <p>Premium Quality</p>
            <div class="price">Rs. 0</div>
            <button>Order Now</button>
        </div>

        <div class="card">
            <div class="design">💳</div>
            <h3>Quality 4</h3>
            <p>Luxury Quality</p>
            <div class="price">Rs. 0</div>
            <button>Order Now</button>
        </div>

    </div>

</div>

</body>
</html>
